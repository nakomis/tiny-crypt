name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

jobs:
  build-esp32:
    name: Build — ESP32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ESP32 firmware
        working-directory: esp32
        run: pio run

  build-attiny85:
    name: Build — ATtiny85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ATtiny85 firmware
        working-directory: attiny85
        run: pio run

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [build-esp32, build-attiny85]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.build-esp32.result }}" != "success" || "${{ needs.build-attiny85.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed"
