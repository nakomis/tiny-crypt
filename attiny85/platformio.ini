[env:attiny85]
platform = atmelavr
board = attiny85
framework = arduino

; 16 MHz required for V-USB. Taken from the internal PLL (ATTinyCore
; CLOCK_SOURCE 6) so no crystal is needed; the internal oscillator alone can't
; prescale to 16 MHz and fails the build. Switch to CLOCK_SOURCE=1 for a crystal.
board_build.f_cpu = 16000000L
build_flags = -DCLOCK_SOURCE=6

; Programme via an ESP32/Arduino running the ArduinoISP sketch
upload_protocol = arduinoisp
